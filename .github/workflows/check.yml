name: vpngate-sstp-check

on:
  schedule:
    # 每 2 小时一次（UTC 偶数点）
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "本轮最多测试几台（0=全部）"
        required: false
        default: "100"
      max_ping:
        description: "只测 vpngate 自报 ping <= 该值"
        required: false
        default: "400"
      jobs:
        description: "并发路数（实测 >1 会被 vpngate 按源 IP 限流，建议 1）"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: vpngate-sstp-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 安装 sstp-client / ppp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sstp-client ppp curl iproute2 python3
          sstpc --help 2>&1 | head -2
          pppd --version 2>&1 | head -1

      - name: 加载 ppp 内核模块
        run: |
          sudo modprobe ppp_generic || true
          sudo modprobe ppp_async || true
          lsmod | grep -E '^ppp' || echo "警告: 没有 ppp 模块，SSTP 可能起不来"

      - name: 跑测试
        env:
          LIMIT: ${{ inputs.limit || github.event.inputs.limit || '100' }}
          MAX_PING: ${{ inputs.max_ping || github.event.inputs.max_ping || '400' }}
          CONNECT_TIMEOUT: "8"
          FETCH_TIMEOUT: "8"
        run: |
          # 多路 netns 并发：每路独立 ppp0/路由表，互不干扰
          sudo env "PATH=$PATH" LIMIT="$LIMIT" MAX_PING="$MAX_PING" \
               CONNECT_TIMEOUT="$CONNECT_TIMEOUT" FETCH_TIMEOUT="$FETCH_TIMEOUT" \
               JOBS="${{ inputs.jobs || github.event.inputs.jobs || '1' }}" \
               bash scripts/parallel.sh

      - name: 提交结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add result.txt result.json
          if git diff --cached --quiet; then
            echo "结果无变化，跳过提交"; exit 0
          fi
          git commit -m "chore: vpngate sstp result $(date -u +%FT%TZ) [skip ci]"
          # 并发提交/手动推送会把远端顶走，这里重试 5 次（每次先 rebase）
          for i in 1 2 3 4 5; do
            if git push; then echo "push ok"; exit 0; fi
            echo "push 失败，第 $i 次重试..."; git pull --rebase --autostash origin main || true; sleep 5
          done
          echo "多次重试仍失败"; exit 1

      - name: 上传 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sstp-result
          path: |
            result.txt
            result.json
          if-no-files-found: warn
