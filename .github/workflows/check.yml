name: vpngate-sstp-check

on:
  schedule:
    # 每 2 小时测一轮（整点采集后 30 分钟）
    - cron: "30 */2 * * *"
  workflow_dispatch:
    inputs:
      max_test:
        description: "本轮最多测几台（0=全库）"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: vpngate-sstp-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 sstp-client / ppp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sstp-client ppp curl iproute2 python3
          sstpc --help 2>&1 | head -2
          pppd --version 2>&1 | head -1

      - name: 加载 ppp 内核模块
        run: |
          sudo modprobe ppp_generic || true
          sudo modprobe ppp_async || true
          lsmod | grep -E '^ppp' || echo "警告: 没有 ppp 模块"

      - name: 检测（上次有效优先 + 全库）
        env:
          MAX_TEST: ${{ inputs.max_test || github.event.inputs.max_test || '0' }}
          CONNECT_TIMEOUT: "8"
          FETCH_TIMEOUT: "8"
        run: |
          sudo env "PATH=$PATH" MAX_TEST="$MAX_TEST" \
               CONNECT_TIMEOUT="$CONNECT_TIMEOUT" FETCH_TIMEOUT="$FETCH_TIMEOUT" \
               python3 check.py

      - name: 提交结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add result.txt result.json sstpall.json
          if git diff --cached --quiet; then echo "结果无变化，跳过提交"; exit 0; fi
          git commit -m "chore: sstp check $(date -u +%FT%TZ) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "push ok"; exit 0; fi
            echo "push 失败，第 $i 次重试..."; git pull --rebase --autostash origin main || true; sleep 5
          done
          exit 1

      - name: 上传 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sstp-result
          path: |
            result.txt
            result.json
          if-no-files-found: warn
