name: vpngate-sstp-check

on:
  schedule:
    # 每 2 小时测一轮（整点采集后 30 分钟）
    - cron: "43 */2 * * *"
  workflow_dispatch:
    inputs:
      concurrency:
        description: "并发数"
        required: false
        default: "20"
      max_test:
        description: "本轮最多测几台（0=全库）"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: vpngate-repo
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 测（cks5 检测接口，无需 root/pppd）
        env:
          CONCURRENCY: ${{ inputs.concurrency || github.event.inputs.concurrency || '20' }}
          MAX_TEST: ${{ inputs.max_test || github.event.inputs.max_test || '0' }}
          REQ_TIMEOUT: "45"
        run: python3 check_api.py

      - name: 提交结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --soft origin/main
            git add -A result.txt result-ranked.txt result.json sstpall.json
            if git diff --cached --quiet; then echo "无变化，跳过提交"; exit 0; fi
            git commit -m "chore: data $(date -u +%FT%TZ) [skip ci]"
            if git push origin HEAD:main; then echo "push ok"; exit 0; fi
            echo "push 失败（第 $i 次），重新对齐 origin 后重试..."
            sleep 5
          done
          echo "push 连续失败，等下一轮"; exit 1
