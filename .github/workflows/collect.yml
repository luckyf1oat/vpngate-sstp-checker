name: vpngate-sstp-collect

on:
  schedule:
    # 每小时采集一次，把当前可见的 SSTP 服务器并进 sstpall.txt
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vpngate-repo
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 采集（API 清单 + 页面 SSTP 端口）
        run: python3 collect.py

      - name: 提交结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --soft origin/main
            git add -A sstpall.txt sstpall.json
            if git diff --cached --quiet; then echo "无变化，跳过提交"; exit 0; fi
            git commit -m "chore: data $(date -u +%FT%TZ) [skip ci]"
            if git push origin HEAD:main; then echo "push ok"; exit 0; fi
            echo "push 失败（第 $i 次），重新对齐 origin 后重试..."
            sleep 5
          done
          echo "push 连续失败，等下一轮"; exit 1
